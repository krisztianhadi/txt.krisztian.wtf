# Builds the Jekyll site and deploys it to GitHub Pages.
# Needs the one-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
      # The github-pages gem excludes CNAME from its output by design, and
      # _site/ is root-owned (container build), so stage into a fresh dir
      # the runner can write before adding the CNAME for the artifact.
      - name: Stage artifact + CNAME
        run: |
          mkdir -p _deploy
          cp -r _site/. _deploy/
          cp CNAME _deploy/CNAME
      # Jekyll runs in safe mode here (no _plugins), so outbound links get
      # their new-tab treatment in this post-build pass instead.
      - name: Annotate external links
        run: python3 scripts/external-links.py _deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
