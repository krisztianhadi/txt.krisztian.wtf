# krisztian.txt - txt.krisztian.wtf
# Jekyll config. See docs/ARCHITECTURE.md and docs/SETUP.md.

title: Notes and Stuff by K
# the visible wordmark (homepage h1 + article backlink)
masthead: Notes and Stuff
description: >-
  Short, messy notes and thoughts from Krisztian, dumped as txt on the web.
author: Krisztian
url: "https://txt.krisztian.wtf"
# Explicitly empty: the site is served from the domain root, and when baseurl
# is left unset jekyll-github-metadata injects one - without a GitHub token it
# falls back to /pages/<owner>/<repo>, which breaks every link in a local build.
baseurl: ""

# Optional site-wide fallback for og:image; a post's own front-matter
# `image:` wins over this. Empty means no og:image until one exists.
og_image: "/assets/images/og/home.png"   # generated by tools/gen-og.mjs

# Build output lives in _site/ and is uploaded by .github/workflows/pages.yml.
destination: _site

# Post URLs are just the slug: /hello-world/
permalink: /:title/

# Render posts dated in the future too (no scheduled posts today).
future: true

# RSS dates come out in this zone (user is UTC+7).
timezone: Asia/Bangkok

# Markdown + code highlighting (same defaults as GitHub Pages).
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# Everything in the tree that is not a dotfile is copied/rendered into _site/,
# docs and README.md included - the workflow uploads _site as-is, so those files
# are reachable on the live domain (/docs/SETUP/, /README.md, /AGENTS/).
